name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ['16', '17', '18']
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL ${{ matrix.pg }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }} postgresql-contrib-${{ matrix.pg }} libipc-run-perl

      - name: Build and install
        run: |
          sudo make PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
          sudo make PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config install

      - name: Regression tests
        run: |
          sudo chmod 755 /home/runner /home/runner/work "$(dirname "$GITHUB_WORKSPACE")"
          sudo chown -R postgres:postgres "$GITHUB_WORKSPACE"
          sudo pg_createcluster --start ${{ matrix.pg }} main \
            || sudo pg_ctlcluster ${{ matrix.pg }} main start
          pg_lsclusters
          PGPORT=$(pg_lsclusters | awk -v v="${{ matrix.pg }}" '$1 == v { print $3; exit }')
          sudo -u postgres env PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config \
            PATH="/usr/lib/postgresql/${{ matrix.pg }}/bin:$PATH" \
            PGUSER=postgres \
            PGPORT="$PGPORT" \
            make installcheck

  # PostgreSQL built from source with --enable-cassert: assertions catch lock,
  # memory-context and buffer-overrun mistakes that a release build hides.
  cassert:
    name: PostgreSQL 18 (assertions)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build PostgreSQL with assertions and run all tests
        run: ./scripts/docker-test-cassert.sh 18.6
